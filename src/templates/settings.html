<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostLift AI Settings</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#e6e9ef; --brand:#2457d6; --bg:#f7f9fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
    header { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:white; border-bottom:1px solid var(--line); }
    a { color:var(--brand); text-decoration:none; font-weight:650; }
    main { max-width:760px; margin:0 auto; padding:32px 18px; }
    form { background:white; border:1px solid var(--line); border-radius:8px; padding:22px; display:grid; gap:16px; }
    label { display:grid; gap:6px; color:var(--muted); font-size:14px; font-weight:650; }
    input, select { height:42px; border:1px solid var(--line); border-radius:8px; padding:0 12px; font:inherit; color:var(--ink); background:white; }
    button { height:42px; border:0; border-radius:8px; padding:0 18px; background:var(--brand); color:white; font-weight:750; cursor:pointer; }
    .note { color:var(--muted); line-height:1.6; }
    .status { color:var(--muted); min-height:24px; }
  </style>
</head>
<body>
  <header>
    <strong>PostLift AI</strong>
    <nav><a href="/dashboard?shop_domain={{ shop_domain }}">Dashboard</a></nav>
  </header>
  <main>
    <h1>Merchant Settings</h1>
    <p class="note">Tune offer eligibility for {{ shop_domain }}. Margin threshold is stored as a decimal, so `0.30` means 30% gross margin.</p>
    <form id="settingsForm">
      <label>Margin threshold
        <input name="margin_threshold" type="number" min="0" max="1" step="0.01" value="0.30">
      </label>
      <label>Stock threshold
        <input name="stock_threshold" type="number" min="0" step="1" value="5">
      </label>
      <label>Plan
        <select name="plan">
          <option value="starter">Starter</option>
          <option value="growth">Growth</option>
          <option value="scale">Scale</option>
        </select>
      </label>
      <button type="submit">Save settings</button>
      <div class="status" id="status"></div>
    </form>
  </main>
  <script>
    const form = document.querySelector("#settingsForm");
    const status = document.querySelector("#status");
    const shopDomain = "{{ shop_domain }}";
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const fields = new FormData(form);
      const body = {
        margin_threshold: Number(fields.get("margin_threshold")),
        stock_threshold: Number(fields.get("stock_threshold")),
        plan: fields.get("plan"),
      };
      status.textContent = "Saving...";
      try {
        const response = await fetch(`/merchants/${encodeURIComponent(shopDomain)}/settings`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        status.textContent = response.ok ? "Saved." : "Could not save settings.";
      } catch {
        status.textContent = "Could not reach the API.";
      }
    });
  </script>
</body>
</html>
