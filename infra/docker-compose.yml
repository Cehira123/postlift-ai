version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: postlift
      POSTGRES_USER: postlift
      POSTGRES_PASSWORD: postlift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  scheduler:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    command: python -m src.scheduler.daily_report

volumes:
  pgdata:
