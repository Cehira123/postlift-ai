# Shopify app configuration. Replace placeholder URLs before deployment.

name = "PostLift AI"
client_id = ""
application_url = "https://postlift-api-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[access_scopes]
scopes = "read_orders,read_products,read_inventory,read_customers,write_draft_orders"

[auth]
redirect_urls = [
  "https://postlift-api-production.up.railway.app/auth/callback",
  "https://localhost:5000/auth/callback",
]

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = ["inventory_levels/update"]
  uri = "/webhooks/inventory_levels/update"

  [[webhooks.subscriptions]]
  topics = ["customers/update"]
  uri = "/webhooks/customers/update"

[app_proxy]
url = "https://postlift-api-production.up.railway.app/proxy"
subpath = "postlift"
prefix = "apps"

[[extensions]]
type = "post_purchase_ui"
name = "PostLift AI Post-Purchase Upsell"
handle = "postlift-ai-upsell"

[app_listing]
name = "PostLift AI"
tagline = "AI-powered post-purchase upsells for Shopify."
description = """
PostLift AI helps Shopify merchants increase order value with one-click post-purchase offers.
It ranks offers by gross margin, inventory, prior acceptance rate, and customer fit, then uses
AI-generated copy when configured. Merchants can monitor revenue, acceptance rate, and A/B test
results from the dashboard.
"""
support_url = "https://your-app.example.com/support"
privacy_policy_url = "https://your-app.example.com/privacy"
developer_name = "PostLift AI"
