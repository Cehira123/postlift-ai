# Render.com インフラ定義ファイル
# https://render.com/docs/yaml-spec

services:
  # ---- API サーバー ----
  - type: web
    name: postlift-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # $7/月。本番は standard ($25/月) 推奨
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: SHOPIFY_API_KEY
        sync: false        # Render Dashboard で手動入力
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_BILLING_TEST
        value: "false"
      - key: APP_URL
        sync: false        # https://postlift-api.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: postlift-db
          property: connectionString

  # ---- 日次レポート スケジューラー ----
  - type: worker
    name: postlift-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    branch: main
    startCommand: python -m src.scheduler.daily_report
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postlift-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: postlift-db
    databaseName: postlift
    user: postlift
    plan: starter          # $7/月。本番は standard 推奨
    region: oregon
    postgresMajorVersion: 15
