[tool.poetry]
name = "postlift-ai"
version = "0.1.0"
description = "Shopify向けAIポスト購入アップセル最適化SaaS"
authors = ["Cehira123"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
httpx = "^0.27.0"
asyncpg = "^0.29.0"
openai = "^1.30.0"
apscheduler = "^3.10.4"
pydantic = "^2.7.0"
python-dotenv = "^1.0.1"

[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
