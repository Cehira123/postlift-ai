name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./src

      - name: Lint
        run: npm run lint
        working-directory: ./src

      - name: Type check
        run: npm run typecheck
        working-directory: ./src

      - name: Test
        run: npm test
        working-directory: ./src
