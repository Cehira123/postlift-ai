name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # secrets.RENDER_DEPLOY_HOOK_URL は GitHub Secrets に登録する
        # Render Dashboard → Service → Settings → Deploy Hook URL をコピー
